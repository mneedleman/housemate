services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && (bundle check || bundle install) && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: development
      # Outgoing email goes to Mailpit: open http://localhost:8025 to read it
      SMTP_ADDRESS: mailpit
      APP_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./api:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    stdin_open: true # allows `docker attach` for debugger sessions
    tty: true

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      # The browser (on your host) calls the API, so this stays localhost
      VITE_API_URL: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./client:/app
      - /app/node_modules # keep container's Linux node_modules, not your macOS ones
    depends_on:
      - api

  # Catches all email sent in development (nothing is delivered for real)
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web inbox

volumes:
  pg_data:
  bundle:
