# Production stack for a single server (Lightsail). Run from the repo root on the server:
#   docker compose -f docker-compose.prod.yml --env-file /opt/housemate/.env up -d --build
# Required in the env file: APP_DOMAIN, POSTGRES_PASSWORD, SECRET_KEY_BASE (see deploy/README.md)

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: housemate_production
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports published: only reachable from the other containers

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: info
      RAILS_MAX_THREADS: 3
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/housemate_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
    # The entrypoint runs db:prepare (create + migrate) before starting the server
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume or you'll re-request them
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:
